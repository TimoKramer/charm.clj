name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0

      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: '25'

      - uses: DeLaGuardo/setup-clojure@3fe9b3ae632c6758d0b7757b0838606ef4287b08 # 13.4
        with:
          cli: latest
          bb: latest
          clj-kondo: latest
          cljfmt: latest

      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            ~/.m2/repository
            ~/.gitlibs
          key: deps-${{ hashFiles('deps.edn') }}
          restore-keys: deps-

      - name: Format check
        run: cljfmt check

      - name: Lint
        run: clj-kondo --fail-level error --lint src test

      - name: Reflection check
        run: clojure -M:reflection

      - name: Test
        run: clojure -M:test

      - name: Test bb
        # The installer is pinned to a release tag rather than master, so a push
        # to that branch cannot change what this step executes. charm needs
        # JLine 4.4.5, which is still only in babashka's dev builds, so the
        # build it fetches is necessarily a moving target.
        run: |
          curl -fsSL -o /tmp/install-bb https://raw.githubusercontent.com/babashka/babashka/v1.13.223/install
          bash /tmp/install-bb --dev-build --dir /tmp
          /tmp/bb test:bb

      # - name: Run vhs
      #   run: |
      #     sudo apt-get -qq update
      #     sudo apt-get -qq install -y ffmpeg ttyd
      #     go install github.com/charmbracelet/vhs@v0.11.0
      #     cd doc/examples/
      #     ${HOME}/go/bin/vhs vhs/pomodoro.tape
      #     ${HOME}/go/bin/vhs vhs/download.tape

      - name: Build JAR
        run: clojure -T:build jar

      - name: Upload artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: charm-jar
          path: target/

  release:
    needs: ci
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0

      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: '25'

      - uses: DeLaGuardo/setup-clojure@3fe9b3ae632c6758d0b7757b0838606ef4287b08 # 13.4
        with:
          cli: latest

      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            ~/.m2/repository
            ~/.gitlibs
          key: deps-${{ hashFiles('deps.edn') }}
          restore-keys: deps-

      - name: Restore artifact
        uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0 # v5
        with:
          name: charm-jar
          path: target/

      - name: Deploy to Clojars
        run: clojure -T:build deploy
        env:
          CLOJARS_USERNAME: ${{ secrets.CLOJARS_USERNAME }}
          CLOJARS_PASSWORD: ${{ secrets.CLOJARS_PASSWORD }}

      - name: Tag release
        env:
          GIT_COMMITTER_EMAIL: ${{ secrets.GIT_COMMITTER_EMAIL }}
        run: |
          git config set user.name "Timo Kramer"
          git config set user.email "$GIT_COMMITTER_EMAIL"
          clojure -T:build tag-release
